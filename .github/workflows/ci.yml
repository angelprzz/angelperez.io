name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-

      # --frozen-lockfile fails the run if package.json and bun.lock disagree,
      # instead of silently resolving a tree other than the committed one.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & typecheck
        run: bun check

      # .env is gitignored, so the runner has none. NEXT_PUBLIC_* vars are
      # inlined at build time, and the placeholder in .env.example is enough
      # to compile — no real Mapbox token needed just to verify the build.
      - name: Build
        run: cp .env.example .env && bun run build
